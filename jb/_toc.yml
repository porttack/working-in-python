format: jb-book
root: index

parts:

# Required reading, in the order a student should hit it.
- caption: Start Here
  chapters:
    - file: orientation
    - file: chap00        # Downey's Preface, unedited
    - file: about

# All nineteen chapters live in ONE numbered part, deliberately.
#
# It is tempting to split these into "Chapters 1-11", "After the Exam", and
# "On Your Own" as three parts with captions, so that course scope shows up
# in the sidebar. Do not. Jupyter Book restarts numbering at each part, so
# chapter 12 would render as "1" in its own section. This course refers to
# chapters by number constantly, and a sidebar that disagrees with the
# syllabus is worse than a sidebar that says less.
#
# Scope is communicated in index.md and orientation.md instead.
- caption: Chapters
  numbered: True
  chapters:
    - file: chap01
    - file: chap02
    - file: chap03
    - file: chap04
    - file: chap05
    - file: chap06
    - file: chap07
    - file: chap08
    - file: chap09
    - file: chap10
    - file: chap11
    - file: chap12
    - file: chap13
    - file: chap14
    - file: chap15
    - file: chap16
    - file: chap17
    - file: chap18
    - file: chap19

