format: jb-book
root: index

parts:

# Required reading, in the order a student should hit it. jupyter_intro goes
# first: before anything else, a student needs to know what a notebook even
# is, and it's the one page that runs live in JupyterLite rather than linking
# out to Colab -- see AUDIT.md, 2026-08-08.
- caption: Start Here
  chapters:
    - file: jupyter_intro
      title: About Jupyter Notebooks
    - file: chap00        # Downey's Preface
    - file: about

# All nineteen chapters live in ONE numbered part, deliberately.
#
# It is tempting to split these into "Chapters 1-11", "After the Exam", and
# "On Your Own" as three parts with captions, so that course scope shows up
# in the sidebar. Do not: a `caption:` on every split adds a bold divider in
# the sidebar, and this course refers to chapters by number constantly, so a
# sidebar with visible section breaks that disagree with the syllabus is
# worse than one that says less.
#
# Scope is communicated in index.md and orientation.md instead.
#
# EXCEPTION, added for chap06b (2026-08-17): an "interlude" -- a chapter
# outside Think Python's own numbering, inserted between two numbered
# chapters (see CHAPTER_MANIFEST.md and AUDIT.md; more are planned, e.g. a
# unit-testing interlude near chapter 9 and one on binary). An interlude
# must not consume a chapter number itself, and must not push every chapter
# after it up by one -- confirmed by an actual local `jupyter-book build`
# that chap07 renders "8." if chap06b is added as a plain sibling `- file:`
# entry in this same list. The fix, also verified by a local build: split
# this one part into three, with `caption:` on only the first so no new
# sidebar divider appears, `numbered: True` on the chapters-only parts, and
# omitted on the interlude's own one-item part. jupyter-book ships
# sphinx-multitoc-numbering specifically so numbering continues across a
# split like this instead of restarting per part -- chapter 7 still renders
# "7.", not "1." or "8.", and next/previous links still flow
# chap06 -> chap06b -> chap07. (The comment two paragraphs up, from before
# this was tested, is wrong about restarting -- kept above only as the
# reason a *captioned* split is still worth avoiding.) Repeat this split
# pattern -- new anonymous part, no caption, `numbered:` omitted -- for
# every future interlude; never add a second `caption:` line to this file's
# Chapters section.
#
# Also considered and rejected: nesting the interlude as a `sections:` child
# of the chapter before it, to get a one-tab sidebar indent. Tested locally:
# it works for the indent, but Sphinx renders it as an HTML <details> that's
# collapsed by default on every page except the interlude's own chapter and
# itself -- a student browsing from chapter 10 would see a closed "6. Return
# Values" toggle with the interlude hidden inside, not something meant to
# read as next in sequence. Used a toc-level `title:` override instead (see
# chap06b's entry below) to prefix "Interlude: " onto the sidebar label only
# -- the notebook's own H1 and page title stay the bare chapter title,
# unprefixed, matching every numbered chapter's own convention.
- caption: Chapters
  numbered: True
  chapters:
    - file: chap01
    - file: chap02
    - file: chap03
    - file: chap04
    - file: chap05
    - file: chap06
- chapters:
    - file: chap06b
      title: "Interlude: Docstrings and Doctests"
- numbered: True
  chapters:
    - file: chap07
# Second interlude, added 2026-08-17: chap07b ("Representing Data"), between chapters 7
# and 8. Outline only as of this writing -- no drafted prose, no exercises -- but wired
# into the TOC now per CHAPTER_MANIFEST.md's Interludes section so the split-part pattern
# and nav-label convention are already in place when the chapter is actually drafted. Same
# three-way-split mechanism as chap06b above; see that entry's comment for why.
- chapters:
    - file: chap07b
      title: "Interlude: Representing Data"
- numbered: True
  chapters:
    - file: chap08
    - file: chap09
    - file: chap10
    - file: chap11
    - file: chap12
    - file: chap13
    - file: chap14
    - file: chap15
    - file: chap16
    - file: chap17
    - file: chap18
    - file: chap19

