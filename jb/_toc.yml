format: jb-book
root: index

parts:

# Required reading, in the order a student should hit it. jupyter_intro goes
# first: before anything else, a student needs to know what a notebook even
# is, and it's the one page that runs live in JupyterLite rather than linking
# out to Colab -- see AUDIT.md, 2026-08-08.
- caption: Start Here
  chapters:
    - file: jupyter_intro
      title: About Jupyter Notebooks
    - file: codespace
      title: Using an Existing Codespace
    - file: chap00        # Downey's Preface
    - file: about

# All nineteen chapters live in ONE numbered part, deliberately.
#
# It is tempting to split these into "Chapters 1-11", "After the Exam", and
# "On Your Own" as three parts with captions, so that course scope shows up
# in the sidebar. Do not: a `caption:` on every split adds a bold divider in
# the sidebar, and this course refers to chapters by number constantly, so a
# sidebar with visible section breaks that disagree with the syllabus is
# worse than one that says less.
#
# Scope is communicated in index.md and orientation.md instead.
- caption: Chapters
  numbered: True
  chapters:
    - file: chap01
    - file: chap02
    - file: chap03
    - file: chap04
    - file: chap05
    - file: chap06
    - file: chap07
    - file: chap08
    - file: chap09
    - file: chap10
    - file: chap11
    - file: chap12
    - file: chap13
    - file: chap14
    - file: chap15
    - file: chap16
    - file: chap17
    - file: chap18
    - file: chap19

# "Interludes": original content, not part of Think Python's own numbering
# (see CHAPTER_MANIFEST.md and AUDIT.md). Both used to sit inline, each
# between two numbered chapters, which required splitting the Chapters part
# above into five pieces so an interlude's own one-item part could go
# unnumbered without pushing every later chapter's number up (confirmed by
# an actual local `jupyter-book build` -- chap07 rendered "8." otherwise).
# Repositioned 2026-09-13 to after chapter 19 instead: the maintainer's
# original inline scope and sequence "did not work out as well as hoped."
# That collapses the five-way split back to the two parts below -- no
# `numbered:` on this one, so sphinx-multitoc-numbering leaves it out of the
# chapter count, matching the same "new anonymous part, no caption, no
# numbered:" pattern the old inline split used. Repeat this pattern -- an
# item in the chapters list below, `title:` overridden to prefix
# "Interlude: " onto the sidebar label only -- for any future interlude;
# never add a second `caption:` line to this file's Chapters part above.
- chapters:
    - file: interlude-a
      title: "Interlude A: Docstrings and Doctests"
    - file: interlude-b
      title: "Interlude B: Representing Data"

# Meta pages: not reading material, but useful to have visible in the
# sidebar on every page rather than buried in "Also here" links on index.md.
#
# Standards-catalog and whole-book-coverage entries point at learn.porttack.com
# now, not this repo's own generated copies -- 2026-09-09, maintainer decision.
# learn/_standards/ is the canonical catalog (this repo's standards/ is a
# synced, read-only mirror; see standards/README.md) and learn's own
# /standards/ page renders a live, always-current per-source coverage report
# (?report=WIP) that supersedes the old static "AP CSP Coverage Map." The
# per-chapter "Standards alignment" sentinel blocks inside chapters 1-8 (and
# future 9-13) still link to this repo's own local alignment/*-standards-
# reference.html anchors -- unaffected by this nav change, since those pages
# are still generated for that purpose, just no longer given their own
# top-level nav entry. Vocabulary entries (a separate, hand-curated system --
# see CLAUDE.md) are unaffected and still point locally.
- caption: Reference
  chapters:
    - file: todo
    - url: https://learn.porttack.com/standards/?report=WIP
      title: AP CSP Coverage Map
    - url: https://learn.porttack.com/standards/apcsp-standards-reference.html
      title: AP CSP Standards Reference
    - url: https://python.porttack.com/alignment/vocabulary-by-chapter.html
      title: Vocabulary by Chapter
    - url: https://python.porttack.com/alignment/ap-vocabulary-coverage.html
      title: AP CSP Vocabulary Coverage
    - url: https://python.porttack.com/alignment/ap-vocabulary-glossary.html
      title: AP CSP Vocabulary Glossary (A-Z)
    - url: https://learn.porttack.com/standards/ca-cs-standards-reference.html
      title: CA CS Standards Reference
    - url: https://learn.porttack.com/standards/csta2026-standards-reference.html
      title: CSTA 2026 Standards Reference
    - url: https://learn.porttack.com/standards/ca-ict-anchor-standards-reference.html
      title: CA ICT & Anchor Standards Reference
